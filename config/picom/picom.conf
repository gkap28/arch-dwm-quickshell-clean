# Schatten
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

# Backend
backend = "glx";

# Fenstertypen: Dock (Quickshell-Bar) ohne Schatten
wintypes:
{
  dock = { shadow = false; };
};

# Transparenz pro Fenster
opacity-rule = [
  "90:class_g = 'Geany'",
];

# Blur aktivieren
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;

# Quickshell-Popups und Docks vom Blur ausnehmen
blur-background-exclude = [
  "window_type = 'override'",
  "window_type = 'dock'",
  "window_type = 'toolbar'",
  "window_type = 'utility'",
  "name = 'quickshell'",
  "class_g = 'quickshell'",
  "class_g = 'Quickshell'",
];
